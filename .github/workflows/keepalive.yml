name: Keep SupportOps available

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wake the API
        run: |
          curl --fail-with-body \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 15 \
            --max-time 90 \
            https://supportops-api.onrender.com/health

      - name: Verify the database connection
        run: |
          curl --fail-with-body \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 20 \
            --connect-timeout 15 \
            --max-time 90 \
            https://supportops-api.onrender.com/health/dependencies
